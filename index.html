
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#073b49">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MIXCARICATURE">
<link rel="manifest" href="./manifest.json">
<title>MIXCARICATURE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #eef7f8;
  color: #073b49;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.container {
  width: 100%;
  max-width: 440px;
  text-align: center;
}

.logo {
  width: 105px;
  height: 105px;
  object-fit: contain;
  border-radius: 22px;
  margin-bottom: 15px;
}

h1 {
  font-size: 29px;
  margin: 0 0 8px;
  letter-spacing: 1px;
}

.subtitle {
  color: #58747a;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 32px;
}

.portal {
  display: block;
  text-decoration: none;
  background: white;
  border: 1px solid #d5e7e9;
  border-radius: 17px;
  padding: 24px 18px;
  margin-bottom: 17px;
  color: #073b49;
  box-shadow: 0 5px 16px rgba(7,59,73,0.07);
  transition: transform 0.15s;
}

.portal:active {
  transform: scale(0.98);
}

.portal-icon {
  font-size: 35px;
  margin-bottom: 10px;
}

.portal h2 {
  margin: 0 0 9px;
  font-size: 19px;
}

.portal p {
  margin: 0;
  font-size: 13px;
  color: #607b80;
  line-height: 1.5;
}

.customer {
  border-left: 5px solid #168a9b;
}

.employee {
  border-left: 5px solid #073b49;
}

.footer {
  margin-top: 28px;
  font-size: 11px;
  color: #81999d;
}
</style>
</head>

<body>
<div class="container">

  <img src="./icon-192.png" class="logo" alt="MIXCARICATURE Logo">

  <h1>MIXCARICATURE</h1>

  <div class="subtitle">
    PRODUCT SCANNER & INVENTORY SYSTEM
  </div>

  <a class="portal customer" href="./customer.html">
    <div class="portal-icon">🛍️</div>
    <h2>CUSTOMER PORTAL</h2>
    <p>Scan products, check prices and browse our product catalog.</p>
  </a>

  <a class="portal employee" href="./employee.html">
    <div class="portal-icon">📦</div>
    <h2>EMPLOYEE PORTAL</h2>
    <p>Access inventory information, available stock and reorder levels.</p>
  </a>

  <div class="footer">
    © MIXCARICATURE
  </div>

</div>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>

</body>
</html>
